  #         resourceGroup: ${{ vars.DEV_RESOURCE_GROUP }}
  #         containerAppName: ${{ vars.DEV_BACKEND_APP }}
  #         imageToDeploy: ${{ env.BACKEND_IMAGE }}:dev
  #
  #     - name: 📗 프론트엔드 배포 (Container Apps)
  #       uses: azure/container-apps-deploy-action@v1
  #       with:
  #         resourceGroup: ${{ vars.DEV_RESOURCE_GROUP }}
  #         containerAppName: ${{ vars.DEV_FRONTEND_APP }}
  #         imageToDeploy: ${{ env.FRONTEND_IMAGE }}:dev
