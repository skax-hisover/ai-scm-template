# ============================================================================
# CD — develop 브랜치 → AKS 개발 환경 배포
# ============================================================================
# [트리거] develop 브랜치에 push (feature/* → develop 머지 시점)
#
# [파이프라인 — 5단계]
#  ┌─────────────┐  ┌──────────────┐
#  │ backend-check│  │frontend-check│   ← 1) 코드 품질 검증
#  └──────┬───────┘  └──────┬───────┘
#         └───────┬──────────┘
#          ┌──────▼───────┐
#          │   docker     │             ← 2) ACR 이미지 빌드 & Push
#          └──────┬───────┘
#          ┌──────▼───────┐
#          │ check-image  │             ← 3) Trivy 보안 스캔
#          └──────┬───────┘
#          ┌──────▼───────┐
#          │   deploy     │             ← 4) AKS Kustomize 배포
#          └──────┬───────┘
#          ┌──────▼───────┐
#          │ slack-notify │             ← 5) Slack 결과 알림
#          └──────────────┘
#
# [필요 GitHub Secrets / Variables]
#  Secrets:
#   AZURE_CREDENTIALS      — az ad sp create-for-rbac --sdk-auth 결과 JSON
#   ACR_LOGIN_SERVER        — myacr.azurecr.io
#   ACR_USERNAME            — ACR 사용자명
#   ACR_PASSWORD            — ACR 비밀번호
#   SLACK_WEBHOOK_URL       — Slack Incoming Webhook URL (선택)
#  Variables:
#   AKS_RESOURCE_GROUP      — AKS 리소스 그룹
#   AKS_CLUSTER_NAME_DEV    — 개발 AKS 클러스터명
#   K8S_NAMESPACE_DEV       — 네임스페이스 (기본 ai-scm-dev)
#   DEV_API_URL             — 프론트엔드 빌드 시 NEXT_PUBLIC_API_URL
# ============================================================================

name: CD — develop 배포

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-dev
  cancel-in-progress: true

env:
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  BACKEND_IMAGE:    ${{ secrets.ACR_LOGIN_SERVER }}/ai-scm/backend
  FRONTEND_IMAGE:   ${{ secrets.ACR_LOGIN_SERVER }}/ai-scm/frontend
  K8S_NAMESPACE:    ${{ vars.K8S_NAMESPACE_DEV || 'ai-scm-dev' }}

# ═════════════════════════════════════════════════════════════════════════════
jobs:

  # ─────────────────────────────────────────────────────────────
  # 1-A) 백엔드 코드 품질 검증
  # ─────────────────────────────────────────────────────────────
  backend-check:
    name: "🐍 Backend 검증"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: 💾 의존성 캐시
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: backend-venv-${{ runner.os }}-${{ hashFiles('backend/pyproject.toml') }}
          restore-keys: backend-venv-${{ runner.os }}-

      - name: 📦 의존성 설치
        run: uv sync

      - name: 🔍 린트 & 포맷 검사
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: 🧪 테스트
        env:
          ENVIRONMENT: local
          SECRET_KEY: test-secret-key-for-ci
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: test_db
          FIRST_SUPERUSER: admin@test.com
          FIRST_SUPERUSER_PASSWORD: testpassword123
        run: uv run pytest --tb=short -q

  # ─────────────────────────────────────────────────────────────
  # 1-B) 프론트엔드 코드 품질 검증
  # ─────────────────────────────────────────────────────────────
  frontend-check:
    name: "📗 Frontend 검증"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 의존성 설치
        run: npm ci

      - name: 🔍 린트 & 타입 검사
        run: |
          npx eslint . --max-warnings 0
          npm run type-check

      - name: 🏗️ 빌드 검증
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  # ─────────────────────────────────────────────────────────────
  # 2) Docker 이미지 빌드 → ACR Push
  # ─────────────────────────────────────────────────────────────
  docker:
    name: "🐳 Docker 빌드 & ACR Push"
    runs-on: ubuntu-latest
    needs: [backend-check, frontend-check]
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: 🔑 ACR 로그인
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 🏷️ 이미지 태그 생성
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "tag=dev-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: 🐍 백엔드 이미지 빌드 & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:dev
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📗 프론트엔드 이미지 빌드 & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.DEV_API_URL || 'http://localhost:8000' }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:dev
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────
  # 3) 이미지 보안 스캔 (Trivy)
  # ─────────────────────────────────────────────────────────────
  check-image:
    name: "🔒 이미지 보안 스캔"
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: 🔑 ACR 로그인
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 🔍 백엔드 이미지 스캔
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.BACKEND_IMAGE }}:${{ needs.docker.outputs.image-tag }}"
          format: "table"
          exit-code: "0"              # 개발: 경고만 (배포 차단 안 함)
          severity: "CRITICAL,HIGH"

      - name: 🔍 프론트엔드 이미지 스캔
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.FRONTEND_IMAGE }}:${{ needs.docker.outputs.image-tag }}"
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"

  # ─────────────────────────────────────────────────────────────
  # 4) AKS 개발 환경 배포 (Kustomize + Traefik)
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: "🚀 AKS 개발 환경 배포"
    runs-on: ubuntu-latest
    needs: [docker, check-image]

    steps:
      - uses: actions/checkout@v4

      - name: 🔑 Azure 로그인
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 🔑 AKS 자격 증명 설정
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ vars.AKS_CLUSTER_NAME_DEV }}

      - name: 📦 Kustomize 이미지 교체 & 배포
        run: |
          cd k8s/overlays/dev

          # CI에서 생성한 태그로 이미지 교체
          kustomize edit set image \
            backend=${{ env.BACKEND_IMAGE }}:${{ needs.docker.outputs.image-tag }} \
            frontend=${{ env.FRONTEND_IMAGE }}:${{ needs.docker.outputs.image-tag }}

          # 네임스페이스 생성 (없으면)
          kubectl create namespace ${{ env.K8S_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

          # Kustomize 배포 적용
          kubectl apply -k .

          # 롤아웃 완료 대기
          kubectl rollout status deployment/backend  -n ${{ env.K8S_NAMESPACE }} --timeout=120s
          kubectl rollout status deployment/frontend -n ${{ env.K8S_NAMESPACE }} --timeout=120s

      - name: ✅ 배포 상태 확인
        if: always()
        run: |
          echo "## 🚀 개발 환경 배포 상태" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| 항목 | 값 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-----|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 이미지 태그 | \`${{ needs.docker.outputs.image-tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 네임스페이스 | \`${{ env.K8S_NAMESPACE }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Pods" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          kubectl get pods -n ${{ env.K8S_NAMESPACE }} -o wide 2>&1 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Services" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          kubectl get svc -n ${{ env.K8S_NAMESPACE }} 2>&1 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────────
  # 5) Slack 결과 알림
  # ─────────────────────────────────────────────────────────────
  slack-notification:
    name: "📢 Slack 알림"
    runs-on: ubuntu-latest
    needs: [docker, check-image, deploy]
    if: always()

    steps:
      - name: 📢 Slack 알림 전송
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ needs.deploy.result }}
          fields: repo,message,commit,author,ref,workflow
          text: |
            *[DEV] 배포 ${{ needs.deploy.result == 'success' && '✅ 성공' || '❌ 실패' }}*
            • 이미지: `${{ needs.docker.outputs.image-tag }}`
            • 커밋: `${{ github.event.head_commit.message }}`
            • 작성자: ${{ github.actor }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true        # Webhook 미설정 시에도 워크플로우 실패 방지
