# ============================================================================
# CD — main 브랜치 → AKS 프로덕션 환경 배포
# ============================================================================
# [트리거] main 브랜치에 push (develop → main 머지 시점)
#
# [파이프라인 — 6단계]  (develop과 동일 구조, 설정 강화)
#  0) 레지스트리 자동 감지 (ACR or GHCR)
#  1) 코드 품질 검증     — 최종 안전장치
#  2) Docker 빌드 & Push — latest + 날짜 버전 태그
#  3) Trivy 보안 스캔    — CRITICAL 발견 시 배포 차단
#  4) AKS 프로덕션 배포  — Kustomize(prod overlay), ACR 설정 시에만
#  5) Slack 알림
#
# [레지스트리 자동 감지]
#  - ACR Secrets 설정됨  → ACR로 Push + AKS 배포 실행
#  - ACR Secrets 미설정  → GHCR로 Push + AKS 배포 건너뜀
#
# [develop과의 차이점]
#  - cancel-in-progress: false  (진행 중 배포를 취소하지 않음)
#  - latest + YYYYMMDD-SHA 태그  (dev 태그 대신)
#  - Trivy exit-code: 1  (CRITICAL 시 배포 차단)
#  - 프로덕션 레플리카  (backend: 3, frontend: 2)
#  - (권장) GitHub Environment 'production' 수동 승인
#
# [필요 GitHub Secrets / Variables]
#  ── ACR + AKS 배포 시 (선택: 인프라 준비 후 등록) ──
#  Secrets:
#   AZURE_CREDENTIALS       — 서비스 주체 JSON
#   ACR_LOGIN_SERVER         — myacr.azurecr.io
#   ACR_USERNAME             — ACR 사용자명
#   ACR_PASSWORD             — ACR 비밀번호
#   SLACK_WEBHOOK_URL        — Slack Incoming Webhook URL (선택)
#  Variables:
#   AKS_RESOURCE_GROUP       — AKS 리소스 그룹
#   AKS_CLUSTER_NAME_PROD    — 프로덕션 AKS 클러스터명
#   K8S_NAMESPACE_PROD       — 네임스페이스 (기본 ai-scm-prod)
#   PROD_API_URL             — 프론트엔드 빌드 시 NEXT_PUBLIC_API_URL
# ============================================================================

name: CD — production 배포

on:
  push:
    branches: [main]

# 프로덕션: 진행 중 배포를 취소하지 않음 (안전)
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE_PROD || 'ai-scm-prod' }}

# ═════════════════════════════════════════════════════════════════════════════
jobs:

  # ─────────────────────────────────────────────────────────────
  # 0) 레지스트리 자동 감지 (ACR vs GHCR)
  # ─────────────────────────────────────────────────────────────
  setup:
    name: "⚙️ 환경 설정"
    runs-on: ubuntu-latest
    outputs:
      use-acr:        ${{ steps.detect.outputs.use_acr }}
      registry:       ${{ steps.detect.outputs.registry }}
      backend-image:  ${{ steps.detect.outputs.backend_image }}
      frontend-image: ${{ steps.detect.outputs.frontend_image }}
    steps:
      - name: 🔍 레지스트리 감지
        id: detect
        run: |
          if [ -n "$ACR_SERVER" ]; then
            echo "✅ ACR 설정 감지 → ACR 사용"
            echo "use_acr=true"                                        >> "$GITHUB_OUTPUT"
            echo "registry=${ACR_SERVER}"                              >> "$GITHUB_OUTPUT"
            echo "backend_image=${ACR_SERVER}/ai-scm/backend"          >> "$GITHUB_OUTPUT"
            echo "frontend_image=${ACR_SERVER}/ai-scm/frontend"        >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ ACR 미설정 → GHCR 폴백"
            echo "use_acr=false"                                       >> "$GITHUB_OUTPUT"
            echo "registry=ghcr.io"                                    >> "$GITHUB_OUTPUT"
            echo "backend_image=ghcr.io/${{ github.repository }}/backend"  >> "$GITHUB_OUTPUT"
            echo "frontend_image=ghcr.io/${{ github.repository }}/frontend" >> "$GITHUB_OUTPUT"
          fi
        env:
          ACR_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}

  # ─────────────────────────────────────────────────────────────
  # 1-A) 백엔드 코드 품질 검증
  # ─────────────────────────────────────────────────────────────
  backend-check:
    name: "🐍 Backend 검증"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: 💾 의존성 캐시
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: backend-venv-${{ runner.os }}-${{ hashFiles('backend/pyproject.toml') }}
          restore-keys: backend-venv-${{ runner.os }}-

      - name: 📦 의존성 설치
        run: uv sync

      - name: 🔍 린트 & 포맷 검사
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: 🧪 테스트
        env:
          ENVIRONMENT: local
          SECRET_KEY: test-secret-key-for-ci
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: test_db
          FIRST_SUPERUSER: admin@test.com
          FIRST_SUPERUSER_PASSWORD: testpassword123
        run: uv run pytest --tb=short -q

  # ─────────────────────────────────────────────────────────────
  # 1-B) 프론트엔드 코드 품질 검증
  # ─────────────────────────────────────────────────────────────
  frontend-check:
    name: "📗 Frontend 검증"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 의존성 설치
        run: npm ci

      - name: 🔍 린트 & 타입 검사
        run: |
          npx eslint . --max-warnings 0
          npm run type-check

      - name: 🏗️ 빌드 검증
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  # ─────────────────────────────────────────────────────────────
  # 2) Docker 이미지 빌드 & Push (ACR 또는 GHCR)
  # ─────────────────────────────────────────────────────────────
  docker:
    name: "🐳 Docker 빌드 & Push"
    runs-on: ubuntu-latest
    needs: [setup, backend-check, frontend-check]
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
      version:   ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # ── ACR 로그인 (ACR 설정 시) ──
      - name: 🔑 ACR 로그인
        if: needs.setup.outputs.use-acr == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ needs.setup.outputs.registry }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # ── GHCR 로그인 (ACR 미설정 시 폴백) ──
      - name: 🔑 GHCR 로그인
        if: needs.setup.outputs.use-acr == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ 버전 태그 생성
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          VERSION=$(date +'%Y%m%d')-${SHORT_SHA}
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: 🐍 백엔드 이미지 빌드 & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ needs.setup.outputs.backend-image }}:latest
            ${{ needs.setup.outputs.backend-image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📗 프론트엔드 이미지 빌드 & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.PROD_API_URL || 'http://localhost:8000' }}
          tags: |
            ${{ needs.setup.outputs.frontend-image }}:latest
            ${{ needs.setup.outputs.frontend-image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────
  # 3) 이미지 보안 스캔 (Trivy)
  # ─────────────────────────────────────────────────────────────
  check-image:
    name: "🔒 이미지 보안 스캔"
    runs-on: ubuntu-latest
    needs: [setup, docker]
    permissions:
      contents: read
      packages: read

    steps:
      # ── ACR 로그인 ──
      - name: 🔑 ACR 로그인
        if: needs.setup.outputs.use-acr == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ needs.setup.outputs.registry }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # ── GHCR 로그인 ──
      - name: 🔑 GHCR 로그인
        if: needs.setup.outputs.use-acr == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔍 백엔드 이미지 스캔
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ needs.setup.outputs.backend-image }}:${{ needs.docker.outputs.image-tag }}"
          format: "table"
          exit-code: "1"              # 프로덕션: CRITICAL 발견 시 배포 차단
          severity: "CRITICAL"

      - name: 🔍 프론트엔드 이미지 스캔
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ needs.setup.outputs.frontend-image }}:${{ needs.docker.outputs.image-tag }}"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL"

  # ─────────────────────────────────────────────────────────────
  # 4) AKS 프로덕션 환경 배포 (ACR 설정 시에만 실행)
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: "🚀 AKS 프로덕션 배포"
    runs-on: ubuntu-latest
    needs: [setup, docker, check-image]
    if: needs.setup.outputs.use-acr == 'true'
    # ── 수동 승인이 필요하면 아래 주석 해제 ──
    # environment: production

    steps:
      - uses: actions/checkout@v4

      - name: 🔑 Azure 로그인
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 🔑 AKS 자격 증명 설정
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ vars.AKS_CLUSTER_NAME_PROD }}

      - name: 📦 Kustomize 이미지 교체 & 배포
        run: |
          cd k8s/overlays/prod

          # CI에서 생성한 태그로 이미지 교체
          kustomize edit set image \
            backend=${{ needs.setup.outputs.backend-image }}:${{ needs.docker.outputs.image-tag }} \
            frontend=${{ needs.setup.outputs.frontend-image }}:${{ needs.docker.outputs.image-tag }}

          # 네임스페이스 생성 (없으면)
          kubectl create namespace ${{ env.K8S_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

          # Kustomize 배포 적용
          kubectl apply -k .

          # 롤아웃 완료 대기 (프로덕션: 3분 타임아웃)
          kubectl rollout status deployment/backend  -n ${{ env.K8S_NAMESPACE }} --timeout=180s
          kubectl rollout status deployment/frontend -n ${{ env.K8S_NAMESPACE }} --timeout=180s

      - name: ✅ 배포 상태 확인
        if: always()
        run: |
          echo "## 🚀 프로덕션 배포 결과" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| 항목 | 값 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-----|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 버전 | \`${{ needs.docker.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Backend | \`${{ needs.setup.outputs.backend-image }}:${{ needs.docker.outputs.image-tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Frontend | \`${{ needs.setup.outputs.frontend-image }}:${{ needs.docker.outputs.image-tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Pods" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          kubectl get pods -n ${{ env.K8S_NAMESPACE }} -o wide 2>&1 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Services" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          kubectl get svc -n ${{ env.K8S_NAMESPACE }} 2>&1 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────────
  # 5) Slack 결과 알림
  # ─────────────────────────────────────────────────────────────
  slack-notification:
    name: "📢 Slack 알림"
    runs-on: ubuntu-latest
    needs: [setup, docker, check-image, deploy]
    if: always()

    steps:
      - name: 📢 Slack 알림 전송
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ needs.deploy.result == 'skipped' && needs.docker.result || needs.deploy.result }}
          fields: repo,message,commit,author,ref,workflow
          text: |
            *[PROD] ${{ needs.setup.outputs.use-acr == 'true' && '배포' || '빌드' }} ${{ (needs.deploy.result == 'skipped' ? needs.docker.result : needs.deploy.result) == 'success' && '✅ 성공' || '❌ 실패' }}*
            • 레지스트리: `${{ needs.setup.outputs.registry }}`
            • 버전: `${{ needs.docker.outputs.version }}`
            • 커밋: `${{ github.event.head_commit.message }}`
            • 작성자: ${{ github.actor }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
