# ============================================================================
# CD - main 브랜치 (프로덕션 환경 배포)
# ============================================================================
# [트리거] main 브랜치에 push 시 (develop → main 머지 시점)
# [목적]   프로덕션 환경에 안정된 코드를 배포
#
# [흐름]
# 1. 코드 품질 검증 (린트, 테스트) - 최종 안전장치
# 2. Docker 이미지 빌드 (latest + 날짜 버전 태그)
# 3. GitHub Container Registry에 push
# 4. (선택) 프로덕션 서버에 배포
#
# [develop과의 차이점]
# - cancel-in-progress: false (진행 중인 배포를 취소하지 않음)
# - latest 태그 사용 (dev 태그 대신)
# - 날짜 기반 버전 태그 (YYYYMMDD-SHA) 사용
# - (선택) environment: production 으로 수동 승인 가능
#
# [필요 설정]
# - Repository Settings → Actions → General → Workflow permissions
#   → "Read and write permissions" 체크
#
# [Azure 배포 시 추가 설정]
# - Secrets: AZURE_CREDENTIALS (서비스 주체 JSON)
# - Variables: PROD_RESOURCE_GROUP, PROD_BACKEND_APP, PROD_FRONTEND_APP
# - Azure Container Apps 또는 Azure App Service 사용
# - (권장) GitHub Environment 'production'에서 수동 승인 설정
# ============================================================================

name: CD - production 배포

on:
  push:
    branches: [main]

# 프로덕션: 진행 중 배포 취소하지 않음 (안전)
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend

jobs:
  # ─── 백엔드 검증 ──────────────────────────────────────────
  backend-check:
    name: "🐍 Backend 검증"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: 💾 의존성 캐시
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: backend-venv-${{ runner.os }}-${{ hashFiles('backend/pyproject.toml') }}
          restore-keys: backend-venv-${{ runner.os }}-

      - name: 📦 의존성 설치
        run: uv sync

      - name: 🔍 린트 & 포맷 검사
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: 🧪 테스트
        env:
          ENVIRONMENT: local
          SECRET_KEY: test-secret-key-for-ci
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: test_db
          FIRST_SUPERUSER: admin@test.com
          FIRST_SUPERUSER_PASSWORD: testpassword123
        run: uv run pytest --tb=short -q

  # ─── 프론트엔드 검증 ──────────────────────────────────────
  frontend-check:
    name: "📗 Frontend 검증"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 의존성 설치
        run: npm ci

      - name: 🔍 린트 & 타입 검사
        run: |
          npm run lint
          npm run type-check

      - name: 🏗️ 빌드 검증
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  # ─── Docker 이미지 빌드 & Push (prod 태그) ─────────────────
  build-backend:
    name: "🐳 Backend 이미지 (prod)"
    runs-on: ubuntu-latest
    needs: [backend-check, frontend-check]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: 🔑 GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ 버전 태그 생성
        id: meta
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          VERSION=$(date +'%Y%m%d')-${SHORT_SHA}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: 🐍 백엔드 이미지 빌드 & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: "🐳 Frontend 이미지 (prod)"
    runs-on: ubuntu-latest
    needs: [backend-check, frontend-check]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: 🔑 GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ 버전 태그 생성
        id: meta
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          VERSION=$(date +'%Y%m%d')-${SHORT_SHA}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: 📗 프론트엔드 이미지 빌드 & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.PROD_API_URL || 'http://localhost:8000' }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── 배포 요약 ────────────────────────────────────────────
  summary:
    name: "📋 배포 요약"
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: always()
    steps:
      - name: 📋 결과 출력
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          VERSION=$(date +'%Y%m%d')-${SHORT_SHA}
          echo "## 🚀 프로덕션 배포 결과" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 항목 | 값 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| 브랜치 | \`main\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 커밋 | \`${SHORT_SHA}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 버전 | \`${VERSION}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend 이미지 | \`${{ env.BACKEND_IMAGE }}:${VERSION}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend 이미지 | \`${{ env.FRONTEND_IMAGE }}:${VERSION}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> \`latest\` 태그도 함께 업데이트되었습니다." >> $GITHUB_STEP_SUMMARY

  # ─── Azure 프로덕션 환경 배포 (서버 준비 시 주석 해제) ──────
  #
  # [사전 준비]
  # 1. Azure CLI로 서비스 주체 생성:
  #    az ad sp create-for-rbac --name "github-actions-prod" \
  #      --role contributor \
  #      --scopes /subscriptions/{subscription-id}/resourceGroups/{resource-group} \
  #      --sdk-auth
  #
  # 2. 출력된 JSON을 GitHub Secret 'AZURE_CREDENTIALS'에 등록
  #
  # 3. GitHub Variables 등록:
  #    - PROD_RESOURCE_GROUP: Azure 리소스 그룹명
  #    - PROD_BACKEND_APP: 백엔드 Container App 이름
  #    - PROD_FRONTEND_APP: 프론트엔드 Container App 이름
  #
  # 4. (권장) GitHub Environment 'production' 생성 후 수동 승인 규칙 설정
  #    Settings → Environments → New environment → "production"
  #    → Required reviewers 추가
