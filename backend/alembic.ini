# Alembic Configuration
# =====================
# alembic upgrade head                          - Apply latest migration
# alembic revision --autogenerate -m "message"  - Auto-generate migration
# alembic downgrade -1                          - Rollback 1 step
# alembic history                               - Show migration history

[alembic]
script_location = app/alembic
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
