# Alembic Configuration
# =====================
# alembic upgrade head     - 최신 마이그레이션 적용
# alembic revision --autogenerate -m "메시지"  - 자동 마이그레이션 생성
# alembic downgrade -1     - 1단계 롤백
# alembic history           - 마이그레이션 이력 확인

[alembic]
script_location = app/alembic
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
