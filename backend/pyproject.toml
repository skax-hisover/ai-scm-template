[project]
name = "ai-scm-template"
version = "0.1.0"
description = "AI-SCM Template Backend"
requires-python = ">=3.11,<4.0"
dependencies = [
    # --- Web Framework ---
    "fastapi[standard]>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
    # --- Database ---
    "sqlalchemy>=2.0.0,<3.0.0",
    "psycopg2-binary>=2.9.0,<3.0.0",
    "alembic>=1.14.0,<2.0.0",
    # --- Task Queue ---
    "celery[redis]>=5.4.0,<6.0.0",
    # --- Authentication ---
    "pyjwt>=2.8.0,<3.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "python-multipart>=0.0.7,<1.0.0",
    # --- Configuration ---
    "pydantic>=2.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    # --- Validation ---
    "email-validator>=2.1.0,<3.0.0",
    # --- Logging ---
    "python-json-logger>=3.0.0,<4.0.0",
    # --- HTTP Client ---
    "httpx>=0.27.0,<1.0.0",
    # --- Monitoring (optional) ---
    "sentry-sdk[fastapi]>=1.40.0,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "mypy>=1.8.0,<2.0.0",
    "ruff>=0.8.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# === Linter & Formatter: Ruff ===
[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG001", # unused arguments
    "T201",   # print statements
    "SIM",    # flake8-simplify
    "N",      # pep8-naming
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# === Type Checker: MyPy ===
[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]
plugins = ["pydantic.mypy"]

# === Testing: Pytest ===
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["app"]
omit = ["app/alembic/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
